<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1711" />
    <meta name="description" content="Kovalt Roller: mesa virtual para jugar Roll For Shoes con tus amigos." />
    <title>Kovalt Roller</title>
    <meta property="og:title" content="Kovalt Roller" />
    <meta property="og:description" content="Mesa virtual para jugar Roll For Shoes con tus amigos." />
    <meta property="og:image" content="https://roller.kovalt.mx/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/Amaranth-Bold.ttf" crossorigin />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/CrimsonPro-Variable.ttf" crossorigin />
    <script>
      // Tema antes del primer pintado (evita el destello): rl-theme × kv-mode (o el esquema del sistema).
      // Misma tabla que src/state/theme.ts; los ejes y la textura los pone la app al arrancar.
      (function () {
        try {
          var ls = localStorage;
          var bg = {
            pergamino: ['#1e1711', '#ede0c3'], taberna: ['#170f0a', '#e7d8bc'],
            cripta: ['#111315', '#dadad3'], bosque: ['#101610', '#dfe4cf'],
          };
          var t = ls.getItem('rl-theme');
          if (!bg[t]) t = 'pergamino';
          var m = ls.getItem('kv-mode');
          if (m !== 'dark' && m !== 'light') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t + '-' + m;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', bg[t][m === 'dark' ? 0 : 1]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
